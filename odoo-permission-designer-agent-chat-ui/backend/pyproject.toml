[project]
name = "odoo-permission-agent"
version = "0.1.0"
description = "LangGraph backend for the Odoo permission visual designer"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0.0",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph-cli[inmem]>=0.4.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
